site_name: statcat-serve
site_description: "The StatCat Suite's serving program: an SDMX-REST service over a sharded catalog of products and editions"
site_author: Gabriel Gellner
site_url: "https://statcat-suite.github.io/statcat-serve/"
repo_url: "https://github.com/StatCat-Suite/statcat-serve"
repo_name: "StatCat-Suite/statcat-serve"

# ── Suite configuration ─────────────────────────────────────────────────────
# The StatCat Suite block, copied from https://statcat-suite.github.io/sites/
# (the hub repository's docs/sites.md). Change it there first; every project
# site carries the same block, so the sites share one look.

validation:
  links:
    anchors: warn

extra_css:
  - https://statcat-suite.github.io/assets/stylesheets/statcat.css

theme:
  name: material
  logo: https://statcat-suite.github.io/assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  favicon: https://statcat-suite.github.io/assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow

extra:
  homepage: https://statcat-suite.github.io/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/StatCat-Suite
      name: StatCat Suite on GitHub

copyright: 'Part of the <a href="https://statcat-suite.github.io/">StatCat Suite</a>'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# ── End of suite configuration ──────────────────────────────────────────────

plugins:
  - search

nav:
  - Overview: index.md
  - Upgrading: upgrading.md
  - Design:
    - Sitemap: design/SITEMAP.md
  - StatCat Suite: https://statcat-suite.github.io/
